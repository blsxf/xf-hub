  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.getElementById(isIOS ? "multiFileInput" : "folderInput").click();
}
function pickJson()   { document.getElementById("jsonInput").click(); }
function exportJson() {
  const s = activeSnap(); if (!s) return showToast("No snapshot");
  triggerDownload(`${(s.deviceName || "device").replace(/[^a-z0-9_-]/gi, "_")}.json`, JSON.stringify(s, null, 2), "application/json");
}

function handlePickedFiles(e) {
  const fileList = Array.from(e.target.files || []);
  if (!fileList.length) return;
  const firstRel = fileList[0].webkitRelativePath || fileList[0].name;
  const rootName = firstRel.includes("/") ? firstRel.split("/")[0] : (/iPad|iPhone|iPod/.test(navigator.userAgent) ? "iPhone Files" : "Files");
  const bucket = (name) => {
    const ext = ("." + (name.split(".").pop() || "")).toLowerCase();
    if ([".pdf",".doc",".docx",".xls",".xlsx",".ppt",".pptx",".txt",".md",".csv",".epub"].includes(ext)) return "Documents";
    if ([".js",".ts",".py",".ps1",".sh",".html",".css",".json",".yml",".c",".cpp",".rs",".go",".sql"].includes(ext)) return "Code & Data";
    if ([".png",".jpg",".jpeg",".webp",".gif",".svg",".heic",".mp4",".mkv",".mov",".mp3",".wav",".ogg"].includes(ext)) return "Media";
    if ([".zip",".7z",".rar",".tar",".gz",".iso",".wbfs"].includes(ext)) return "Archives";
    if ([".exe",".msi",".apk",".dmg",".app"].includes(ext)) return "Apps";
    return "Other";
  };
  const cats = {}; const subFolders = new Map(); let totalBytes = 0;
  const parsed = fileList.map(f => {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/");
    const sub = parts.length > 2 ? parts[1] : "(root)";
    const b = bucket(f.name);
    totalBytes += f.size;
    cats[b] = cats[b] || { count: 0, bytes: 0 }; cats[b].count++; cats[b].bytes += f.size;
    const sf = subFolders.get(sub) || { name: sub, count: 0, bytes: 0 }; sf.count++; sf.bytes += f.size; subFolders.set(sub, sf);
    return {
      name: f.name, path: rel, area: sub, cat: b, bytes: f.size,
      sizeMB: +(f.size / 1e6).toFixed(2),
      mod: new Date(f.lastModified).toISOString().slice(0, 16).replace("T", " "),
      mtime: f.lastModified
    };
  });
  const recent = [...parsed].sort((a,b) => b.mtime - a.mtime).slice(0, 25);
  const largest = [...parsed].sort((a,b) => b.bytes - a.bytes).slice(0, 20);
  const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  saveBrowserSnapshot({
    id: `browser-${rootName}-${Date.now()}`,
    deviceName: rootName, userName: isMobile ? "Phone" : "Folder",
    platform: isMobile ? "Mobile" : "Browser", os: navigator.platform || "Browser",
    scannedAt: new Date().toISOString().slice(0, 16).replace("T", " "), totalFiles: parsed.length,
    drives: [{ name: rootName, label: "Scanned", totalGB: +(totalBytes/1e9).toFixed(2), usedGB: +(totalBytes/1e9).toFixed(2), freeGB: 0, usedPct: 100 }],
    folders: Array.from(subFolders.values()).sort((a,b) => b.bytes - a.bytes).slice(0, 16).map(sf => ({
      name: sf.name, path: `${rootName}/${sf.name}`, topCount: sf.count, fileCount: sf.count, sizeGB: +(sf.bytes/1e9).toFixed(2), sample: []
    })),
    categories: Object.entries(cats).map(([name, v]) => ({ name, count: v.count, sizeGB: +(v.bytes/1e9).toFixed(2), sizeMB: +(v.bytes/1e6).toFixed(1) })),
    recent, largest, apps: [],
    health: { staleTempFiles: 0, staleTempMB: 0, dlInstallers: 0, rtrOrphans: 0 },
    index: [...recent, ...largest, ...parsed.slice(0, 300)].slice(0, 500).map(f => ({ kind: "file", name: f.name, path: f.path, area: f.area, sizeMB: f.sizeMB, mod: f.mod }))
  });
  closeSheet();
  showToast(`Scanned ${parsed.length} files`);
  e.target.value = "";
}
document.getElementById("folderInput").addEventListener("change", handlePickedFiles);
document.getElementById("multiFileInput").addEventListener("change", handlePickedFiles);

document.getElementById("jsonInput").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await readFileText(f));
    if (obj && obj.deviceName) { saveBrowserSnapshot(obj); closeSheet(); showToast("Loaded " + obj.deviceName); }
  } catch (err) { showToast("Invalid JSON"); }
  e.target.value = "";
});

  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });

  pickLocalToolHtml, removeTool, renderMain, resetDefaultPins, runAudit, safeOpenUrl, safeScrollTop, saveCachedToolFile, saveIcarusSettings, savePins,
  saveSyncSettings, saveToolEdits, selectDevice, selectMode, selectSuite, setGateMode, setPlaytestStatus,
  setPtKind, showToast, smartTapTool, submitIcarusPin, submitPlaytest, syncAllTools, syncTool, toggleTheme, triggerProtocol,
  triggerPwaInstall, useLocalIcarus
};
Object.assign(window, XF_API);

// Boot
loadPins();
loadSnapshots();
loadTools();
let savedMode = null, savedSuite = null;
try { savedMode = localStorage.getItem(LS_MODE); savedSuite = localStorage.getItem(LS_SUITE); } catch (e) {}
const hashSuite = (location.hash || "").replace(/^#/, "").toLowerCase();
const reqSuite = (getQueryParam("suite") || (hashSuite === "ep" || hashSuite === "xf" ? hashSuite : "")).toLowerCase();
const reqMode = getQueryParam("mode").toLowerCase();
if ((reqSuite === "ep" || reqSuite === "xf") && suiteUnlocked(reqSuite)) {
  applySuite(reqSuite, true);
  selectMode(reqMode === "other" ? "other" : (reqMode === "my" ? "my" : (savedMode === "other" ? "other" : "my")));
} else if (reqSuite === "ep" || reqSuite === "xf") {
  currentMode = (reqMode === "other" || (reqMode !== "my" && savedMode === "other")) ? "other" : "my";
  setGateMode(currentMode);
  openModeGate();
  openLock(reqSuite);
} else {
  currentMode = (savedMode === "other") ? "other" : "my";
  setGateMode(currentMode);
  openModeGate();
}
})();
